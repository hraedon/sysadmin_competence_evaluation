name: Build and push assessment app

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Without this, build-push-action falls back to the docker driver and
      # pushes through the docker daemon ("pushing ... with docker" in the
      # log). That path intermittently fails against GHCR with "unknown blob"
      # at manifest commit -- every layer uploads, then the manifest PUT
      # references a blob the registry has not finished committing. Setting up
      # buildx uses buildkit's own registry pusher instead, which retries and
      # orders the commit correctly.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push assessment app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Build and push lab controller
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/lab-controller/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-lab-controller:latest
            ghcr.io/${{ github.repository }}-lab-controller:${{ github.sha }}

      - name: Update image tags in k8s manifests
        run: |
          sed -i -E "s|ghcr.io/${{ github.repository }}-lab-controller:[a-zA-Z0-9._-]+|ghcr.io/${{ github.repository }}-lab-controller:${{ github.sha }}|g" platform/k8s/lab-controller-deployment.yaml
          sed -i -E "s|ghcr.io/${{ github.repository }}:[a-zA-Z0-9._-]+|ghcr.io/${{ github.repository }}:${{ github.sha }}|g" platform/k8s/deployment.yaml

      - name: Commit updated image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add platform/k8s/lab-controller-deployment.yaml platform/k8s/deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }} [skip ci]"
          git push
