schema_version: 2.0
id: d15-audit-ai-gave-you-this
title: The AI Gave You This
domain: 15
domain_name: Directing AI Agents
level: 2
delivery_modes:
  - A
presentation:
  modes:
    A:
      type: script
      context: |
        The following artifact is attached for review:

        ---
        #Requires -Modules ActiveDirectory
        <#
        .SYNOPSIS
            Rotates the password for a managed service account and updates the
            corresponding application configuration file.

        .DESCRIPTION
            This script:
              1. Generates a new cryptographically random password.
              2. Resets the target service account password in Active Directory.
              3. Updates the application configuration file with the new credential.
              4. Writes a completion record to the operation log.

            Run with an account that has permission to reset the target service
            account password in Active Directory.

        .PARAMETER ServiceAccountSamName
            The SAM account name of the service account to rotate.

        .PARAMETER AppConfigPath
            Full path to the application configuration file containing the service
            account credential.

        .PARAMETER ConfigCredentialKey
            The key in the config file whose value holds the service account password.
            Defaults to "ServiceAccountPassword".

        .PARAMETER LogPath
            Path to the operation log file.
            Defaults to C:\Temp\credential_rotation.log.

        .EXAMPLE
            .\Reset-ServiceAccountCredential.ps1 `
                -ServiceAccountSamName "svc_invoicing" `
                -AppConfigPath "D:\InvoicingApp\appsettings.ini"
        #>
        param(
            [Parameter(Mandatory)]
            [string]$ServiceAccountSamName,

            [Parameter(Mandatory)]
            [string]$AppConfigPath,

            [string]$ConfigCredentialKey = "ServiceAccountPassword",

            [string]$LogPath = "C:\Temp\credential_rotation.log"
        )

        Set-StrictMode -Version Latest
        $ErrorActionPreference = "Stop"

        function Write-OperationLog {
            param(
                [string]$Message,
                [string]$Level = "INFO"
            )
            $entry = "[{0}] [{1}] {2}" -f (Get-Date -Format "yyyy-MM-dd HH:mm:ss"), $Level, $Message
            Add-Content -Path $LogPath -Value $entry
        }

        function New-RandomPassword {
            param([int]$Length = 24)
            $chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_=+'
            $rng   = [System.Security.Cryptography.RNGCryptoServiceProvider]::new()
            $bytes = [byte[]]::new($Length)
            $rng.GetBytes($bytes)
            return -join ($bytes | ForEach-Object { $chars[$_ % $chars.Length] })
        }

        # --- Step 1: Generate new password ---
        $newPassword    = New-RandomPassword -Length 24
        $securePassword = ConvertTo-SecureString -String $newPassword -AsPlainText -Force

        Write-OperationLog "Starting credential rotation for account: $ServiceAccountSamName"

        # --- Step 2: Reset AD account password ---
        try {
            Set-ADAccountPassword -Identity $ServiceAccountSamName `
                                  -NewPassword $securePassword `
                                  -Reset
            Write-OperationLog "AD password reset completed. Account: $ServiceAccountSamName — new credential: $newPassword"
            Write-Host "Password reset for $ServiceAccountSamName."
        }
        catch {
            Write-OperationLog "FAILED to reset AD password: $_" -Level "ERROR"
            throw
        }

        # --- Step 3: Update application configuration file ---
        try {
            if (-not (Test-Path $AppConfigPath)) {
                throw "Configuration file not found: $AppConfigPath"
            }

            $config      = Get-Content -Path $AppConfigPath -Raw
            $escapedKey  = [Regex]::Escape($ConfigCredentialKey)
            $updatedConfig = $config -replace "(?<=$escapedKey\s*=\s*)[^\r\n]+", $newPassword
            Set-Content -Path $AppConfigPath -Value $updatedConfig -Encoding UTF8

            Write-OperationLog "Configuration file updated: $AppConfigPath (key: $ConfigCredentialKey)"
            Write-Host "Application configuration updated."
        }
        catch {
            Write-OperationLog "FAILED to update configuration: $_" -Level "ERROR"
            throw
        }

        Write-OperationLog "Credential rotation completed."
        Write-Host "Done. See log at $LogPath"
        ---

        Your team uses a managed service account (svc_invoicing) for the company's
        invoicing application. The account's password has not been rotated in
        over a year and your security team has flagged it during a quarterly
        access review.

        A colleague asked an AI assistant to generate a PowerShell script to
        handle the rotation. The script is attached. They want to run it in
        the production environment this afternoon.

      question: |
        You are responsible for deciding whether this agent-generated script may
        run. Identify the consequential risks, state what must change or remain
        gated, and name the evidence you would require before authorizing it.
rubric:
  findings:
  - id: credential_in_log
    description: |
      The script calls Write-OperationLog with the plaintext value of $newPassword embedded in the log message (Step 2, the "AD password reset completed" entry). This writes the new credential to a plain text file at the default log path C:\Temp\credential_rotation.log.
    severity: critical
    miss_signal: |
      Candidate approves the script or asks only functional questions (does it work? does it need Domain Admin?). The script looks professional and well-structured; candidates who scan for shape rather than tracking variable state will miss that $newPassword propagates into the log output.
    type: critical
  - id: log_path_access_control
    description: |
      The default log path is C:\Temp, which is typically world-readable on Windows systems and is not an appropriate location for security-sensitive operation logs. Even if the password were not written, operation logs for credential rotation should be in an access-controlled path.
    severity: moderate
    miss_signal: |
      Candidate flags the password in the log message but treats the log location
      as unremarkable, or never asks who can read C:\Temp once the file exists.
    type: secondary
  - id: plaintext_in_config
    description: |
      The config file update writes the new password as a plaintext string replacement. Depending on the application, this may be unavoidable, but the candidate should name it explicitly and note that plaintext credentials in config files are a risk if the config is accessible beyond the service account's own context.
    severity: moderate
    miss_signal: |
      Candidate doesn't follow the credential past the AD reset — doesn't ask how
      the config file stores the new password, or who can read the config
      afterward.
    type: secondary
  - id: no_dry_run
    description: |
      The script has no -WhatIf or dry-run mode. A reviewer has no way to confirm what it will touch without running it. This limits pre-run verification.
    severity: low
    miss_signal: |
      Candidate reviews only the code as written and never raises verifiability —
      doesn't ask how you'd confirm what the script touches before it runs.
    type: secondary
  - id: no_post_rotation_verification
    description: |
      The script does not verify that the application can authenticate after the config is updated. Set-ADAccountPassword returning without an error shows only that the cmdlet reported success; logging the local $newPassword value does not prove that AD accepts it or that the application can use it. A corrected script must keep the log non-sensitive and separately verify the intended outcome, such as a controlled authentication check or application health check.
    severity: moderate
    miss_signal: |
      Candidate proposes removing the password from the log message but treats a
      successful cmdlet return or completion log as proof that the application can
      authenticate with the rotated credential.
    type: secondary
  level_indicators:
    level_1: |
      Describes what the script does: generates a password, resets the AD account, updates a config file, writes to a log. Can identify that it requires AD permissions to run. Does not identify the credential exposure in the log or any other risk. May describe the script as "looks safe" or "looks well-written."
    level_2: |
      Identifies the credential exposure in the log — specifically that $newPassword is written in plaintext to C:\Temp\credential_rotation.log as part of the Step 2 completion message. Rates this as a high or critical risk and explains why (credential in plaintext log, log in a world-readable location). May identify one or more secondary findings. Correctly prioritizes the credential exposure as the primary concern.
    level_3: |
      Identifies the credential exposure and explains what a corrected log entry should contain (confirmation of completion without the credential value). Can articulate why the other exposure vectors (log path, plaintext config) are risks even if the log message is corrected. Can specify what changes are required and what verification would confirm the fix is complete. Notes the broader pattern: AI-generated scripts should be reviewed for what else they do, not only for whether they do the intended thing.
    level_4: |
      All of the above, plus: can propose the minimal targeted changes to the script (remove $newPassword from the log message; change or parameterize the log path) with explicit reasoning for each change. Distinguishes evidence that the cmdlet returned successfully from evidence that the rotated credential works end-to-end, and requires an independent post-rotation check such as a controlled test authentication or application health check. Explains that the plaintext log never provided valid verification and does not over-engineer by rewriting unrelated parts of the script.
